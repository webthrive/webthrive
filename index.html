<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colin Harbut</title>
<meta name="description" content="Colin Harbut — WebThrive, LLC.">
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.webthrive.io/">
<meta property="og:title" content="Colin Harbut">
<meta property="og:description" content="WebThrive, LLC.">
<meta property="og:site_name" content="Colin Harbut">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a; --muted:#63635d;
    --display:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#fff;color:var(--ink);font-family:var(--body);
    display:grid;place-items:center;padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:34ch}
  h1{
    font-family:var(--display);font-weight:600;letter-spacing:-.035em;
    font-size:clamp(1.5rem,4vw,1.9rem);line-height:1.1;margin:0;
  }
  .role{font-size:14.5px;color:var(--muted);margin:8px 0 0}
  .mail{
    display:inline-block;margin-top:26px;font-size:15px;color:var(--ink);
    text-decoration:none;border-bottom:1px solid #c9c9c2;padding-bottom:2px;
  }
  .mail:hover{border-color:var(--ink)}
  footer{margin-top:34px;font-size:12.5px;color:#9a9a93}
</style>
</head>
<body>
<main>
  <h1>Colin Harbut</h1>
  <p class="role">Fractional CMO — B2B, SaaS and AI.</p>
  <a class="mail" href="mailto:colin@webthrive.io">colin@webthrive.io</a>
  <footer>WebThrive, LLC</footer>
</main>
</body>
</html>
